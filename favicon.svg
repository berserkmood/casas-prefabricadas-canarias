<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#1b2d40"/>

  <!-- House: outer silhouette + inner C cutout (evenodd creates the hollow C interior) -->
  <path fill-rule="evenodd" fill="white" d="
    M 50,20 L 14,48 L 14,73 L 62,73 Q 86,65 86,42 Q 86,18 50,20 Z
    M 50,30 Q 68,26 70,44 Q 70,64 56,66 L 22,64 L 22,48 Q 36,30 50,30 Z
  "/>

  <!-- Door cutout -->
  <rect x="34" y="57" width="18" height="16" fill="#1b2d40"/>

  <!-- Left step extension -->
  <rect x="8" y="54" width="8" height="19" fill="white"/>

  <!-- Wave dark band -->
  <path d="M 14,73 Q 40,63 64,72 Q 80,78 88,68 L 88,78 Q 78,88 58,81 Q 34,73 14,82 Z" fill="#1e3a50"/>

  <!-- Green swoosh -->
  <path d="M 22,79 Q 48,68 72,77 Q 82,81 90,74" stroke="#7aba32" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- 4-pointed sparkle star -->
  <path d="M 80,19 L 81.5,25 L 83,19 L 81.5,13 Z M 75,19 L 81,20.5 L 87,19 L 81,17.5 Z" fill="#f0cc58"/>
</svg>
